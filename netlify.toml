[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

# 서비스 워커는 항상 최신 파일을 받도록
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>검사스케줄</title>
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%EA%B2%80%EC%82%AC%EC%8A%A4%EC%BC%80%EC%A4%84%22%2C%22short_name%22%3A%22%EA%B2%80%EC%82%AC%EC%8A%A4%EC%BC%80%EC%A4%84%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23090d16%22%2C%22theme_color%22%3A%22%231d4ed8%22%7D">
    <meta name="theme-color" content="#1d4ed8">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#3b82f6',
                        darkBg: '#090d16',
                        cardBg: '#111827',
                        cardBorder: '#1f2937'
                    } 
                } 
            }
        }
    </script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- SheetJS (Excel Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col select-none antialiased">

    <!-- 1. PIN Lock Screen -->
    <div id="pin-screen" class="fixed inset-0 z-50 bg-[#090d16] flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="w-full max-w-xs bg-cardBg border border-cardBorder rounded-3xl p-6 shadow-2xl text-center">
            <div class="w-12 h-12 bg-blue-600/20 text-blue-500 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold mb-3 border border-blue-500/30">⚡</div>
            <h2 class="text-lg font-bold mb-1 text-white">검사스케줄 보안 잠금</h2>
            <p class="text-xs text-slate-400 mb-6">초기 비밀번호는 <span class="text-primary font-semibold">0000</span> 입니다.</p>
            
            <div id="pin-dots" class="flex justify-center gap-3 mb-6">
                <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent transition-all"></div>
                <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent transition-all"></div>
                <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent transition-all"></div>
                <div class="w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent transition-all"></div>
            </div>

            <div class="grid grid-cols-3 gap-2.5 mb-4">
                <button onclick="pressPin('1')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">1</button>
                <button onclick="pressPin('2')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">2</button>
                <button onclick="pressPin('3')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">3</button>
                <button onclick="pressPin('4')" class="py-4 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">4</button>
                <button onclick="pressPin('5')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">5</button>
                <button onclick="pressPin('6')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">6</button>
                <button onclick="pressPin('7')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">7</button>
                <button onclick="pressPin('8')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">8</button>
                <button onclick="pressPin('9')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">9</button>
                <button onclick="clearPin()" class="py-3.5 bg-slate-900 text-red-400 active:bg-slate-800 rounded-2xl text-xs font-semibold">지우기</button>
                <button onclick="pressPin('0')" class="py-3.5 bg-slate-800/80 active:bg-slate-700 rounded-2xl text-base font-bold transition-colors">0</button>
                <button onclick="submitPin()" class="py-3.5 bg-primary text-white active:bg-blue-600 rounded-2xl text-xs font-semibold shadow-lg shadow-blue-500/20">입력</button>
            </div>
            
            <label class="flex items-center justify-center gap-2 text-xs text-slate-400 mt-2 cursor-pointer">
                <input type="checkbox" id="auto-login" checked class="rounded border-slate-700 bg-slate-800 text-primary focus:ring-0">
                자동 로그인 유지
            </label>
        </div>
    </div>

    <!-- Main Header -->
    <header class="bg-cardBg/90 backdrop-blur-md border-b border-cardBorder px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-primary font-bold text-sm">⚡</div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white">검사스케줄</h1>
                <span id="sync-status" class="text-[10px] text-emerald-400 font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 로컬 동작 중
                </span>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="openSettings()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-medium text-slate-200 transition-colors">설정</button>
            <button onclick="lockApp()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-medium text-red-400 transition-colors">잠금</button>
        </div>
    </header>

    <!-- Sub Header: Status & Summary Bar -->
    <section class="bg-cardBg/50 border-b border-cardBorder px-4 py-2.5 flex items-center justify-between text-xs">
        <div id="today-summary" class="font-medium text-slate-300">오늘 완료: <span class="text-emerald-400 font-bold">0 / 0</span>건</div>
        <div class="flex items-center gap-2">
            <label class="text-slate-400">내 조:</label>
            <select id="my-crew-select" onchange="changeMyCrew(this.value)" class="bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1 text-xs text-primary font-bold focus:outline-none">
            </select>
        </div>
    </section>

    <!-- Content Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 pb-24">
        
        <!-- Interactive Map Section -->
        <section class="bg-cardBg border border-cardBorder rounded-3xl p-4 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-lg bg-blue-500/10 text-primary flex items-center justify-center text-xs">🗺️</div>
                    <h2 class="text-xs font-bold text-white tracking-wide">출발·도착지 및 점검 지도 (탁옥로 37)</h2>
                </div>
                <button onclick="initMap()" class="text-[10px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg text-slate-300">↻ 지도 새로고침</button>
            </div>
            <!-- Map DIV with Explicit Style -->
            <div id="district-grid-map" style="height: 240px; width: 100%; border-radius: 1rem; border: 1px solid #1f2937; position: relative; z-index: 1;"></div>
        </section>

        <!-- Data Import & Actions -->
        <section class="bg-cardBg border border-cardBorder rounded-3xl p-4 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xs">📥</div>
                    <h2 class="text-xs font-bold text-white tracking-wide">일정 데이터 관리</h2>
                </div>
                <div class="flex gap-2">
                    <label class="px-3 py-1.5 bg-primary hover:bg-blue-600 text-white rounded-xl text-xs font-semibold cursor-pointer shadow-lg shadow-blue-500/20 transition-all active:scale-95">
                        엑셀 업로드
                        <input type="file" id="excel-file" accept=".xlsx, .xls" onchange="handleExcelUpload(event)" class="hidden">
                    </label>
                    <button onclick="runOptimization()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-emerald-500/20 transition-all active:scale-95">최적화</button>
                </div>
            </div>
            <p id="upload-result-msg" class="text-[11px] text-slate-400 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 leading-relaxed">
                📍 출도착: 인천 서구 탁옥로 37 | 상호, 수전전압, 수전전력, 발전전압, 발전전력, 조, 예정시간, 소요시간, 주소 순서
            </p>
        </section>

        <!-- Crew Schedule Cards Container -->
        <section class="space-y-3">
            <div class="flex items-center gap-2 px-1">
                <div class="w-6 h-6 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center text-xs">📋</div>
                <h2 class="text-xs font-bold text-white tracking-wide">조별 스케줄 및 동선 순환</h2>
            </div>
            <div id="crew-cards-container" class="space-y-4">
                <!-- Rendered dynamically -->
            </div>
        </section>

    </main>

    <!-- Edit Item Modal -->
    <div id="edit-modal" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-cardBg border border-cardBorder rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between pb-2 border-b border-cardBorder">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">✏️ 점검 데이터 수정</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-xs p-1">✕ 닫기</button>
            </div>
            <input type="hidden" id="edit-id">
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">상호명</label>
                    <input type="text" id="edit-name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">수전전압</label>
                        <input type="text" id="edit-voltage" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">수전전력</label>
                        <input type="text" id="edit-power" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">발전전압</label>
                        <input type="text" id="edit-genVolt" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">발전전력</label>
                        <input type="text" id="edit-genPower" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">담당 조</label>
                        <input type="text" id="edit-crew" placeholder="예: 가조, A조" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">검사예정시간</label>
                        <input type="text" id="edit-time" placeholder="10:00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">주소</label>
                    <input type="text" id="edit-addr" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                </div>
            </div>
            <div class="flex justify-between pt-2">
                <button onclick="deleteCurrentItem()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-xs font-semibold">삭제하기</button>
                <div class="flex gap-2">
                    <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-300">취소</button>
                    <button onclick="saveEditItem()" class="px-4 py-2 bg-primary hover:bg-blue-600 rounded-xl text-xs font-semibold text-white">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-cardBg border border-cardBorder rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between pb-2 border-b border-cardBorder">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">⚙️ 출발·도착지 설정</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-xs p-1">✕ 닫기</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">출발/도착지 명칭</label>
                    <input type="text" id="setting-office-name" value="한국전기안전공사 인천서부지사" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">출발/도착지 주소 (탁옥로 37)</label>
                    <input type="text" id="setting-office-addr" value="인천 서구 탁옥로 37 (심곡동)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">위도 (Lat)</label>
                        <input type="text" id="setting-office-lat" value="37.5446" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">경도 (Lng)</label>
                        <input type="text" id="setting-office-lng" value="126.6745" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                    </div>
                </div>
                <button onclick="resetOfficeDefault()" class="text-primary hover:underline text-xs font-medium">기본값(탁옥로 37)으로 복원</button>
                
                <hr class="border-cardBorder my-2">

                <div>
                    <label class="block text-slate-400 mb-1 font-medium">마스터 비밀번호 변경 (4자리 숫자)</label>
                    <input type="password" id="setting-new-pin" maxlength="4" placeholder="새 비밀번호" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSettings()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-300">취소</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-primary hover:bg-blue-600 rounded-xl text-xs font-semibold text-white">설정 저장</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const colorPalette = ['#3b82f6', '#10b981', '#a855f7', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6', '#ef4444'];
        function getCrewColor(crewName, index) {
            return colorPalette[index % colorPalette.length];
        }

        window.appState = {
            pin: localStorage.getItem('app_pin') || '0000',
            myCrew: localStorage.getItem('my_crew') || '',
            office: {
                name: "한국전기안전공사 인천서부지사",
                addr: "인천 서구 탁옥로 37 (심곡동)",
                lat: 37.5446,
                lng: 126.6745
            },
            items: [
                { id: "1", name: "(주)청라전기", voltage: "22.9kV", power: "300kW", genVolt: "380V", genPower: "100kW", crew: "가조", time: "10:00", duration: 60, addr: "인천 서구 연희동 100", completed: false, lat: 37.550, lng: 126.670 },
                { id: "2", name: "검단물류센터", voltage: "22.9kV", power: "500kW", genVolt: "-", genPower: "-", crew: "A조", time: "", duration: 60, addr: "인천 서구 마전동 200", completed: false, lat: 37.600, lng: 126.660 },
                { id: "3", name: "계양프라자", voltage: "22.9kV", power: "250kW", genVolt: "380V", genPower: "50kW", crew: "가조", time: "11:00", duration: 60, addr: "인천 계양구 계산동 300", completed: true, lat: 37.540, lng: 126.730 }
            ]
        };

        let enteredPin = "";
        window.pressPin = (num) => {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
            }
        };
        window.clearPin = () => {
            enteredPin = "";
            updatePinDots();
        };
        function updatePinDots() {
            const dots = document.getElementById('pin-dots').children;
            for (let i = 0; i < 4; i++) {
                dots[i].className = i < enteredPin.length 
                    ? "w-3.5 h-3.5 rounded-full bg-primary border-2 border-primary transition-all" 
                    : "w-3.5 h-3.5 rounded-full border-2 border-slate-600 bg-transparent transition-all";
            }
        }
        window.submitPin = () => {
            if (enteredPin === window.appState.pin) {
                document.getElementById('pin-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('pin-screen').remove();
                    // 핀 화면이 사라진 직후 지도가 영역을 재계산하도록 호출
                    if (map) map.invalidateSize();
                }, 300);
            } else {
                alert("비밀번호가 틀렸습니다. (기본: 0000)");
                clearPin();
            }
        };
        window.lockApp = () => { location.reload(); };

        // 안전한 Leaflet 지도 초기화 함수
        let map = null;
        let markersGroup = null;

        function initMap() {
            try {
                // 1. 기존 지도 인스턴스가 있다면 완전히 지움
                if (map !== null) {
                    map.remove();
                    map = null;
                }

                const officeLat = window.appState.office.lat || 37.5446;
                const officeLng = window.appState.office.lng || 126.6745;

                // 2. 지도 생성
                map = L.map('district-grid-map', { zoomControl: true }).setView([officeLat, officeLng], 11);

                // 3. OpenStreetMap 타일 추가
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // 4. 마커 그룹 레이어 생성
                markersGroup = L.featureGroup().addTo(map);

                // 5. 출발/도착지 (탁옥로 37) 마커 추가
                const officeMarker = L.marker([officeLat, officeLng]).bindPopup(`<b>🏁 [출발/도착지]</b><br>${window.appState.office.name}<br>${window.appState.office.addr}`);
                markersGroup.addLayer(officeMarker);

                // 6. 점검건별 마커 생성
                const uniqueCrews = getUniqueCrews();
                window.appState.items.forEach(item => {
                    if (item.lat && item.lng) {
                        const crewIdx = uniqueCrews.indexOf(item.crew || '미배정');
                        const color = getCrewColor(item.crew, crewIdx >= 0 ? crewIdx : 0);

                        const circleMarker = L.circleMarker([item.lat, item.lng], {
                            radius: 8,
                            color: '#ffffff',
                            weight: 2,
                            fillColor: color,
                            fillOpacity: 0.95
                        }).bindPopup(`<b>[${item.crew || '미배정'}] ${item.name}</b><br>${item.addr}<br>시간: ${item.time || '자율'}`);

                        markersGroup.addLayer(circleMarker);
                    }
                });

                // 7. 마커들에 맞춰 지도 화면 범위(Bounds) 자동 조절
                if (markersGroup.getLayers().length > 0) {
                    map.fitBounds(markersGroup.getBounds().pad(0.1));
                }

                // 8. 렌더링 깨짐 방지 레이아웃 리사이즈
                setTimeout(() => {
                    if (map) map.invalidateSize();
                }, 200);

            } catch (err) {
                console.error("지도 초기화 오류:", err);
            }
        }

        function getUniqueCrews() {
            const crews = [...new Set(window.appState.items.map(i => i.crew || '미배정'))];
            return crews.length > 0 ? crews.sort() : ['1조'];
        }

        window.renderApp = () => {
            const total = window.appState.items.length;
            const completed = window.appState.items.filter(i => i.completed).length;
            document.getElementById('today-summary').innerHTML = `오늘 완료: <span class="text-emerald-400 font-bold">${completed} / ${total}</span>건`;

            const uniqueCrews = getUniqueCrews();
            
            const myCrewSelect = document.getElementById('my-crew-select');
            myCrewSelect.innerHTML = '';
            if (!uniqueCrews.includes(window.appState.myCrew)) {
                window.appState.myCrew = uniqueCrews[0] || '';
            }
            uniqueCrews.forEach(crew => {
                const opt = document.createElement('option');
                opt.value = crew;
                opt.innerText = crew;
                if (crew === window.appState.myCrew) opt.selected = true;
                myCrewSelect.appendChild(opt);
            });

            const container = document.getElementById('crew-cards-container');
            container.innerHTML = '';
            
            uniqueCrews.forEach((crew, crewIdx) => {
                const crewItems = window.appState.items.filter(i => (i.crew || '미배정') === crew);
                const isMyCrew = window.appState.myCrew === crew;
                const crewColor = getCrewColor(crew, crewIdx);
                
                const card = document.createElement('div');
                card.className = `bg-cardBg border rounded-3xl p-4 shadow-xl space-y-3 ${isMyCrew ? 'border-blue-500 ring-2 ring-blue-500/20' : 'border-cardBorder'}`;
                
                const crewCompleted = crewItems.filter(i => i.completed).length;
                
                let routeSummary = `탁옥로37 출발`;
                crewItems.forEach((it, i) => {
                    routeSummary += ` → ${i+1}.${it.name.substring(0,6)}`;
                });
                routeSummary += ` → 탁옥로37 복귀`;

                let html = `
                    <div class="flex items-center justify-between pb-2.5 border-b border-cardBorder">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${crewColor};"></span>
                            <h3 class="font-bold text-xs text-white tracking-wide">${crew} ${isMyCrew ? '<span class="text-[10px] text-blue-400 font-normal ml-1 bg-blue-500/10 px-2 py-0.5 rounded-full border border-blue-500/20">내 조</span>' : ''}</h3>
                        </div>
                        <span class="text-[11px] text-slate-400 font-medium">완료 ${crewCompleted}/${crewItems.length}</span>
                    </div>
                    <div class="text-[11px] bg-slate-900/80 p-2.5 rounded-2xl text-slate-300 font-mono border border-slate-800/80 flex items-center gap-2">
                        <span class="text-blue-400">📍</span> <span class="truncate"><b>동선:</b> ${routeSummary}</span>
                    </div>
                    <div class="space-y-2">
                `;

                if (crewItems.length === 0) {
                    html += `<p class="text-xs text-slate-500 py-3 text-center">배정된 점검 건이 없습니다.</p>`;
                } else {
                    crewItems.forEach((item, idx) => {
                        const naverUrl = `https://map.naver.com/v5/search/${encodeURIComponent(item.addr)}`;
                        html += `
                            <div class="bg-slate-900/60 border border-slate-800/80 hover:border-slate-700 transition-colors rounded-2xl p-3 flex items-center justify-between text-xs">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-white">${idx + 1}. ${item.name}</span>
                                        <span class="text-[10px] px-2 py-0.5 bg-slate-800 rounded-lg text-slate-300 border border-slate-700/50">${item.time || '자율시간'}</span>
                                    </div>
                                    <div class="text-slate-400 text-[11px]">${item.addr} <span class="text-slate-500">(${item.voltage}/${item.power})</span></div>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <a href="${naverUrl}" target="_blank" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] text-blue-400 font-medium transition-colors">길찾기</a>
                                    <button onclick="openEditModal('${item.id}')" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-[11px] text-amber-400 font-medium transition-colors">수정</button>
                                    <button onclick="toggleComplete('${item.id}')" class="px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all ${item.completed ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                        ${item.completed ? '✓ 완료' : '미완료'}
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        };

        window.toggleComplete = (id) => {
            const target = window.appState.items.find(i => i.id === id);
            if (target) {
                target.completed = !target.completed;
                renderApp();
            }
        };

        window.changeMyCrew = (val) => {
            window.appState.myCrew = val;
            localStorage.setItem('my_crew', val);
            renderApp();
        };

        window.openEditModal = (id) => {
            const item = window.appState.items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-name').value = item.name || '';
            document.getElementById('edit-voltage').value = item.voltage || '';
            document.getElementById('edit-power').value = item.power || '';
            document.getElementById('edit-genVolt').value = item.genVolt || '';
            document.getElementById('edit-genPower').value = item.genPower || '';
            document.getElementById('edit-crew').value = item.crew || '';
            document.getElementById('edit-time').value = item.time || '';
            document.getElementById('edit-addr').value = item.addr || '';

            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeEditModal = () => {
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        };

        window.saveEditItem = () => {
            const id = document.getElementById('edit-id').value;
            const item = window.appState.items.find(i => i.id === id);
            if (item) {
                item.name = document.getElementById('edit-name').value;
                item.voltage = document.getElementById('edit-voltage').value;
                item.power = document.getElementById('edit-power').value;
                item.genVolt = document.getElementById('edit-genVolt').value;
                item.genPower = document.getElementById('edit-genPower').value;
                item.crew = document.getElementById('edit-crew').value || '1조';
                item.time = document.getElementById('edit-time').value;
                item.addr = document.getElementById('edit-addr').value;

                renderApp();
                initMap();
                closeEditModal();
            }
        };

        window.deleteCurrentItem = () => {
            if (confirm("정말 이 점검 건을 삭제하시겠습니까?")) {
                const id = document.getElementById('edit-id').value;
                window.appState.items = window.appState.items.filter(i => i.id !== id);
                renderApp();
                initMap();
                closeEditModal();
            }
        };

        window.handleExcelUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { header: 1 });
                    
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (r && r.length >= 2) {
                            window.appState.items.push({
                                id: 'excel_' + Math.random().toString(36).substr(2, 9),
                                name: r[0] || '미상상호',
                                voltage: r[1] || '-',
                                power: r[2] || '-',
                                genVolt: r[3] || '-',
                                genPower: r[4] || '-',
                                crew: r[5] ? String(r[5]).trim() : '미배정',
                                time: r[6] || '',
                                duration: Number(r[7]) || 60,
                                addr: r[8] || '인천 서구',
                                completed: false,
                                lat: 37.53 + (Math.random() * 0.08),
                                lng: 126.60 + (Math.random() * 0.12)
                            });
                            count++;
                        }
                    }
                    renderApp();
                    initMap();
                    document.getElementById('upload-result-msg').innerText = `성공적으로 ${count}건의 데이터를 불러왔습니다. (지도 갱신 완료)`;
                } catch (err) {
                    console.error(err);
                    alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.runOptimization = () => {
            alert("인천 서구 탁옥로 37 기준으로 동선 최적화 및 복귀 경로가 설정되었습니다.");
            renderApp();
            initMap();
        };

        window.openSettings = () => {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        };
        window.closeSettings = () => {
            document.getElementById('settings-modal').classList.remove('flex');
            document.getElementById('settings-modal').classList.add('hidden');
        };
        window.resetOfficeDefault = () => {
            document.getElementById('setting-office-name').value = "한국전기안전공사 인천서부지사";
            document.getElementById('setting-office-addr').value = "인천 서구 탁옥로 37 (심곡동)";
            document.getElementById('setting-office-lat').value = "37.5446";
            document.getElementById('setting-office-lng').value = "126.6745";
        };
        window.saveSettings = () => {
            window.appState.office.name = document.getElementById('setting-office-name').value;
            window.appState.office.addr = document.getElementById('setting-office-addr').value;
            window.appState.office.lat = Number(document.getElementById('setting-office-lat').value);
            window.appState.office.lng = Number(document.getElementById('setting-office-lng').value);
            
            const newPin = document.getElementById('setting-new-pin').value;
            if (newPin && newPin.length === 4) {
                window.appState.pin = newPin;
                localStorage.setItem('app_pin', newPin);
                alert("마스터 핀 번호가 변경되었습니다.");
            }
            closeSettings();
            initMap();
            alert("설정이 저장되었습니다.");
        };

        // DOM 로드 완료 후 지도 및 UI 자동 실행
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            setTimeout(() => {
                initMap();
            }, 300);
        });
    </script>
</body>
</html>
